    theme:
      css/quotation-dashboard-style.css: {}

quotation-pdf-preview:
  css:
    theme:
      https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css: { type: external }
  dependencies:
    - srdesign/srdesign

